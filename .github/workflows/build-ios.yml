name: Build iOS IPA

on:
  # 鎵嬪姩瑙﹀彂锛堟帹鑽愶級
  workflow_dispatch:
  # 鎺ㄩ€佸埌 main 鍒嗘敮鏃惰嚜鍔ㄦ瀯寤?  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 馃摜 Checkout code
        uses: actions/checkout@v4

      - name: 馃摝 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 馃摜 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 馃敤 Build web assets
        run: npm run build

      - name: 馃摫 Add iOS platform
        run: |
          # ios/ 涓嶅叆搴擄紝姣忔鐢?CI 閲嶆柊鐢熸垚瀹屾暣鍘熺敓宸ョ▼锛堝惈 App.xcodeproj锛?          rm -rf ios/
          npx cap add ios
          npx cap sync ios

      - name: 馃搵 Copy custom iOS plugins into Xcode project
        run: |
          # 浠?native-plugins 澶嶅埗鍒?Xcode 椤圭洰婧愮爜鐩綍
          cp -f native-plugins/IosTtsPlugin/IosTtsPlugin.swift ios/App/App/
          cp -f native-plugins/IosTtsPlugin/IosTtsPlugin.m     ios/App/App/
          cp -f native-plugins/IosAsrPlugin/IosAsrPlugin.swift ios/App/App/
          cp -f native-plugins/IosAsrPlugin/IosAsrPlugin.m     ios/App/App/
          echo "Plugin files copied to ios/App/App/"

      - name: 馃摝 Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: 馃摫 Sync iOS project
        run: npx cap sync ios

      - name: 馃敡 Add plugins to Xcode project
        run: |
          cd ios/App
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            target = project.targets.first
            app_group = project.main_group.find_subpath("App", true) || project.main_group

            ["IosTtsPlugin", "IosAsrPlugin"].each do |plugin_name|
              group = app_group.find_subpath(plugin_name, true) || app_group.new_group(plugin_name)
              ["#{plugin_name}.swift", "#{plugin_name}.m"].each do |filename|
                filepath = "App/#{filename}"
                next unless File.exist?(filepath)
                existing = group.files.find { |f| f.path == filename }
                next if existing
                file_ref = group.new_file(filepath)
                target.add_file_references([file_ref])
                puts "Added #{filename} to Xcode project"
              end
            end

            project.save
            puts "Xcode project updated"
          ' || echo "Note: xcodeproj gem not available, plugins may need manual adding"

      - name: 馃敡 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 馃摑 Update Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'SpeakEasy needs microphone for voice recognition'" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'SpeakEasy needs speech recognition for English practice'" ios/App/App/Info.plist 2>/dev/null || true

      - name: 馃敤 Build IPA (unsigned, no Apple Developer account needed)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/App.xcarchive archive

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r SpeakEasy-ios-unsigned.ipa Payload
          echo "鉁?IPA built successfully"
          ls -la SpeakEasy-ios-unsigned.ipa

      - name: 馃摛 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakEasy-iOS-IPA
          path: ios/App/build/SpeakEasy-ios-unsigned.ipa
          retention-days: 30

      - name: 馃搳 Build summary
        run: |
          echo "## 鉁?iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "IPA 鏂囦欢宸茬敓鎴愶紝涓嬭浇姝ラ锛? >> $GITHUB_STEP_SUMMARY
          echo "1. 鍦?Actions 椤甸潰鐐瑰嚮鏈杩愯" >> $GITHUB_STEP_SUMMARY
          echo "2. 婊氬姩鍒板簳閮?Artifacts 鍖哄煙" >> $GITHUB_STEP_SUMMARY
          echo "3. 涓嬭浇 SpeakEasy-iOS-IPA" >> $GITHUB_STEP_SUMMARY
          echo "4. 瑙ｅ帇寰楀埌 .ipa 鏂囦欢" >> $GITHUB_STEP_SUMMARY
          echo "5. 鐢ㄧ埍鎬濆姪鎵嬫垨 AltStore 绛惧悕瀹夎鍒?iPhone" >> $GITHUB_STEP_SUMMARY
